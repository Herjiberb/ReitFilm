const stOf=e=>e.r<0?'u':e.isNew?'n':ser(e)!==e.orig?'e':'';
let sT;const save=()=>{clearTimeout(sT);sT=setTimeout(()=>{try{localStorage.rf_draft=JSON.stringify(E.list.map(e=>({id:e.id,r:e.r,tags:e.tags,custom:e.custom,note:e.note,isNew:e.isNew,orig:e.orig})))}catch(x){}},400);stats()};
async function fetchDet(id,force){let d=E.det.get(id);if(d&&!force)return d;if(!force){d=await tx('readonly',s=>s.get(id));if(d&&d.auto){E.det.set(id,d);return d}}
for(let k=0;k<3;k++){try{const j=await tmdb(`/movie/${id}?append_to_response=keywords,credits`);d={id,title:j.title,year:(j.release_date||'').slice(0,4),poster:j.poster_path,overview:j.overview,runtime:j.runtime,genres:(j.genres||[]).map(g=>g.name),vote:j.vote_average,dir:((j.credits&&j.credits.crew)||[]).filter(c=>c.job==='Director').map(c=>c.name).slice(0,2).join(', '),auto:autoTag(j)};E.det.set(id,d);tx('readwrite',s=>s.put(d));return d}catch(e){if(e.message==='404'){d={id,title:'Unknown #'+id,year:'',genres:[],auto:[]};E.det.set(id,d);return d}await new Promise(r=>setTimeout(r,800*(k+1)))}}return null}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const x=items[i++];await fn(x)}}))}
/* list + panel */
function stats(){const c={n:0,e:0,u:0};E.list.forEach(e=>{const s=stOf(e);if(s)c[s]++});$('#st').innerHTML=`<span><b>${E.list.length}</b> total</span><span><b>${c.n}</b> new</span><span><b>${c.e}</b> edited</span><span><b style="color:${c.u?'var(--p)':'inherit'}">${c.u}</b> unrated</span>`;
$('#tabs').innerHTML=[['all','All'],['n','New'],['e','Edited'],['u','Unrated']].map(t=>`<button class="pill sq ${E.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}
function renderList(){const q=E.q.toLowerCase();const l=E.list.filter(e=>{const s=stOf(e);if(E.tab==='n'&&!(e.isNew))return false;if(E.tab==='e'&&s!=='e')return false;if(E.tab==='u'&&s!=='u')return false;if(q){const d=E.det.get(e.id);if(!(d&&d.title.toLowerCase().includes(q)))return false}return true}).reverse();
$('#list').innerHTML=l.map(e=>{const d=E.det.get(e.id),s=stOf(e),R=RT[e.r];return `<button class="li sq ${E.sel===e.id?'on':''}" data-id="${e.id}"><div class="th" ${d&&d.poster?`data-p="${esc(d.poster)}" data-z="w92"`:''}></div><div class="tt"><b>${d?esc(d.title):'Loading #'+e.id}</b><small>${d?esc(d.year):''}${e.isNew?'<span class="dot n">NEW</span>':s==='e'?'<span class="dot e">EDITED</span>':''}</small></div>${R?`<span class="rb" style="--c:${R.c}" title="${R.n}">${ico('r'+e.r)}</span>`:'<small>unrated</small>'}</button>`}).join('')||'<div class="empty"><p>Nothing here yet.</p></div>';hy($('#list'));stats()}
function renderPanel(){const e=E.list.find(x=>x.id===E.sel),p=$('#right');
if(!e){p.innerHTML=`<div class="empty">${ico('film')}<h2>Pick a movie or search to add one</h2><p>Keys 1 to 5 set the rating. J and K move through the list.</p></div>`;return}
const d=E.det.get(e.id)||{title:'Loading…',genres:[],auto:[]};
const tg=Object.keys(GROUPS).map(g=>`<h3>${GROUPS[g]}</h3><div class="tg">${TAGS.map((t,i)=>t[1]===g?`<button class="tag sq ${e.tags.includes(i)?'on':d.auto.includes(i)?'sg':''}" data-t="${i}">${esc(t[0])}</button>`:'').join('')}</div>`).join('');
const missing=d.auto.filter(i=>!e.tags.includes(i)).length;
p.innerHTML=`<div class="ed"><div><div class="po" ${d.poster?`data-p="${esc(d.poster)}" data-z="w342"`:''}></div></div><div>
<h2>${esc(d.title)}</h2><div class="meta">${esc([d.year,d.runtime?d.runtime+' min':'',d.dir,(d.genres||[]).join(', ')].filter(Boolean).join('  \u2022  '))}</div><p class="ov">${esc(d.overview||'')}</p>
<h3>Rating</h3><div class="rs">${RT.map((x,i)=>`<button class="rt sq ${e.r===i?'on':''}" data-r="${i}" style="--c:${x.c}">${ico('r'+i)}${x.n}<small style="opacity:.6">${i+1}</small></button>`).join('')}</div>
<h3>Tags <button class="btn sq" data-a="apply" style="padding:5px 12px;font-size:12px">Add ${missing} suggested</button><button class="btn sq" data-a="reset" style="padding:5px 12px;font-size:12px">Reset to auto</button><button class="btn sq" data-a="refetch" style="padding:5px 12px;font-size:12px">Refresh data</button></h3>
<small style="color:var(--m)">Dashed pink = suggested by the algorithm from genre, era, runtime, ratings and TMDB keywords.</small>${tg}
<h3>Custom tags</h3><div class="tg">${e.custom.map(c=>`<button class="tag cu on sq" data-c="${esc(c)}">#${esc(c)} ×</button>`).join('')}<input class="fld" id="ci" placeholder="Type and press Enter" style="width:210px;padding:7px 12px" maxlength="24"></div>
<h3>Review note <span id="cc" style="margin-left:auto">${e.note.length}/600</span></h3><textarea class="fld" id="nt" maxlength="600" placeholder="Your take (optional)">${esc(e.note)}</textarea>
<div style="margin-top:18px"><button class="btn sq" data-a="del" style="color:#ff6b8f">Remove from reviews</button></div></div></div>`;hy(p)}
function select(id){E.sel=id;renderList();renderPanel();const b=$(`.li[data-id="${id}"]`);b&&b.scrollIntoView({block:'nearest'})}
function touch(){save();renderList()}
/* add */
async function addMovie(id,r=-1,note=''){if(E.list.some(e=>e.id===id)){select(id);toast('Already in your reviews');return null}
const d=await fetchDet(id);if(!d){toast('TMDB request failed. Try again.');return null}
const e={id,r,tags:d.auto.slice(),custom:[],note,isNew:true,orig:''};E.list.push(e);return e}
let sT2;$('#sq').oninput=ev=>{clearTimeout(sT2);const q=ev.target.value.trim(),res=$('#res');if(q.length<2){res.hidden=true;return}
sT2=setTimeout(async()=>{try{const j=await tmdb('/search/movie?include_adult=false&query='+encodeURIComponent(q));const rs=j.results.slice(0,7);res.hidden=false;
res.innerHTML=rs.map(m=>`<button class="rr" data-add="${m.id}">${m.poster_path?`<img alt="" src="https://image.tmdb.org/t/p/w92${m.poster_path}">`:'<i></i>'}<span><b>${esc(m.title)}</b><small>${esc((m.release_date||'').slice(0,4))} \u2022 ${m.vote_count} votes</small></span></button>`).join('')||'<div class="rr">No results</div>'}catch(e){toast('Search failed')}},280)};
/* bulk */
const ratingOf=s=>{s=(s||'').trim().toLowerCase();if(/^[0-4]$/.test(s))return+s;if(!s)return-1;if(/^(dnw|do not|never)/.test(s))return 0;if(s.startsWith('bad'))return 1;if(/^(med|mid|meh|ok)/.test(s))return 2;if(s.startsWith('good'))return 3;if(s.startsWith('must'))return 4;return-1};
function bulkUI(){const m=$('#md');m.hidden=false;m.innerHTML=`<div class="sheet"><h2>Bulk add movies</h2><small style="color:var(--m)">One per line. Use a title, "Title (year)", a TMDB id, or an IMDb id (tt...). Optional: add "| rating | note" where rating is 0 to 4 or dnw, bad, mid, good, must.</small><textarea class="fld" id="bt" style="min-height:200px" placeholder="Inception (2010) | 4 | Mind melting&#10;Cats (2019) | 0&#10;603&#10;tt0111161 | must"></textarea><div id="log"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sq" data-a="bclose">Close</button><button class="btn pr sq" id="bgo">Add all</button></div></div>`;
$('#bgo').onclick=async()=>{const lines=$('#bt').value.split('\n').map(s=>s.trim()).filter(Boolean),log=$('#log');log.innerHTML='';let ok=0;const say=(t,c)=>{const d=document.createElement('div');d.className=c;d.textContent=t;log.append(d)};
await pool(lines,4,async ln=>{const [t0,rs,...ns]=ln.split('|'),t=t0.trim();try{let id=0;
if(/^\d+$/.test(t))id=+t;else if(/^tt\d+$/.test(t)){const j=await tmdb(`/find/${t}?external_source=imdb_id`);id=j.movie_results[0]&&j.movie_results[0].id}else{const ym=t.match(/^(.*?)\s*\((\d{4})\)$/),n=ym?ym[1]:t;const j=await tmdb(`/search/movie?include_adult=false&query=${encodeURIComponent(n)}${ym?'&year='+ym[2]:''}`);id=j.results[0]&&j.results[0].id}
if(!id)return say('Not found: '+t,'no');const e=await addMovie(id,ratingOf(rs),ns.join('|').trim());if(e){ok++;say('Added: '+E.det.get(id).title,'ok')}else say('Skipped: '+t,'no')}catch(x){say('Failed: '+t,'no')}});
say(`Done. ${ok} added.`,'ok');renderList();if(ok)save()}}
/* export */
function exportTxt(){const rated=E.list.filter(e=>e.r>=0),skip=E.list.length-rated.length;const txt='#RF1\n'+rated.map(ser).join('\n')+'\n';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='reviews.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
rated.forEach(e=>{e.orig=ser(e);e.isNew=false});save();renderList();toast(`Exported ${rated.length} reviews (${(new Blob([txt]).size/1024).toFixed(1)} KB)${skip?`. ${skip} unrated skipped`:''}`)}
/* load */
async function load(txt,fromDraft){const m=parse(txt);E.list=[...m.values()].map(e=>({...e,isNew:false,orig:ser(e)}));await afterLoad()}
async function afterLoad(){E.sel=E.list.length?E.list[E.list.length-1].id:null;renderList();renderPanel();stats();
pool(E.list.map(e=>e.id),6,async id=>{if(!E.det.has(id)){await fetchDet(id);renderList();if(E.sel===id)renderPanel()}})}
/* events */
document.addEventListener('click',async ev=>{const t=ev.target;let b;
if(!t.closest('.srch'))$('#res').hidden=true;
if(b=t.closest('[data-add]')){$('#res').hidden=true;$('#sq').value='';const e=await addMovie(+b.dataset.add);if(e){E.tab='all';E.q='';select(e.id);save();toast('Added. Set a rating.')}return}
if(b=t.closest('[data-tab]')){E.tab=b.dataset.tab;renderList();return}
if(b=t.closest('.li'))return select(+b.dataset.id);
const e=E.list.find(x=>x.id===E.sel);
if(b=t.closest('[data-r]')){if(e){e.r=+b.dataset.r;touch();renderPanel()}return}
if(b=t.closest('[data-t]')){if(e){const i=+b.dataset.t,k=e.tags.indexOf(i);k>=0?e.tags.splice(k,1):e.tags.push(i);touch();renderPanel()}return}
if(b=t.closest('[data-c]')){if(e){e.custom=e.custom.filter(c=>c!==b.dataset.c);touch();renderPanel()}return}
if(b=t.closest('[data-a]')){const a=b.dataset.a;
if(a==='bclose'){$('#md').hidden=true;$('#md').innerHTML='';return}
if(!e)return;const d=E.det.get(e.id)||{auto:[]};
if(a==='apply'){e.tags=[...new Set([...e.tags,...d.auto])]}
else if(a==='reset'){e.tags=d.auto.slice()}
else if(a==='refetch'){await fetchDet(e.id,true);toast('Refreshed from TMDB')}
else if(a==='del'){if(!confirm('Remove this movie from the reviews?'))return;E.list=E.list.filter(x=>x!==e);E.sel=null}
touch();renderPanel()}});
document.addEventListener('input',ev=>{const t=ev.target,e=E.list.find(x=>x.id===E.sel);if(t.id==='nt'&&e){e.note=t.value;$('#cc').textContent=t.value.length+'/600';save()}});
document.addEventListener('keydown',ev=>{const t=ev.target,e=E.list.find(x=>x.id===E.sel);
if(t.id==='ci'&&ev.key==='Enter'&&e){const c=cl(t.value);if(c&&!e.custom.includes(c)){e.custom.push(c);touch();renderPanel();$('#ci').focus()}return}
if(/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;
if(ev.key>='1'&&ev.key<='5'&&e){e.r=+ev.key-1;touch();renderPanel()}
if(ev.key==='j'||ev.key==='k'){const ids=$$('.li').map(x=>+x.dataset.id),i=ids.indexOf(E.sel),n=ids[i+(ev.key==='j'?1:-1)];if(n)select(n)}
if(ev.key==='Escape'){$('#md').hidden=true}});
$('#bOpen').onclick=()=>$('#fi').click();
$('#fi').onchange=async ev=>{const f=ev.target.files[0];if(f){await load(await f.text());toast('Loaded '+E.list.length+' reviews')}};
$('#bBulk').onclick=bulkUI;$('#bExp').onclick=exportTxt;
$('#bAuto').onclick=()=>{let n=0;E.list.forEach(e=>{const d=E.det.get(e.id);if(d&&!e.tags.length&&d.auto.length){e.tags=d.auto.slice();n++}});touch();renderPanel();toast(n+' entries auto-tagged')};
$('#left').addEventListener('input',ev=>{if(ev.target.id==='sq')return});
/* boot */
(async()=>{await idb;
let txt=await fetch('reviews.txt',{cache:'no-store'}).then(r=>r.ok?r.text():'').catch(()=>'');
await load(txt);
try{const dr=JSON.parse(localStorage.rf_draft||'null');if(dr&&dr.length&&JSON.stringify(dr.map(e=>e.id))!==JSON.stringify(E.list.map(e=>e.id))||dr&&dr.some(e=>e.isNew)){if(confirm('Restore your unsaved draft from last time? (Cancel loads reviews.txt as-is)')){E.list=dr.map(e=>({...e,custom:e.custom||[],tags:e.tags||[],note:e.note||''}));await afterLoad()}}}catch(e){}
if(!E.list.length)toast('No reviews.txt found. Use Open, or search to start fresh.');
setTimeout(()=>{$('#ld').classList.add('gone');setTimeout(()=>$('#ld').remove(),600)},200)})();
</script>
</body>
</html>
